services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      RATE_LIMIT_REQUESTS: 120
      RATE_LIMIT_WINDOW_SECONDS: 60
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
